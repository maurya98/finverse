# LMS Backend - Staging
# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
version: '3.8'
services:
  chat:
    build:
      context: ../../../
      dockerfile: infra/docker/chat/Dockerfile
    image: finverse/chat:staging
    container_name: chat-staging
    restart: unless-stopped
    network_mode: host
    env_file:
      - chat.env
    environment:
      - NODE_ENV=staging
